name: Build and deploy ASP.Net Core app to Azure Web App - superprecios
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ConnectionStrings__ConexionBD: ${{ secrets.PROD_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Remove existing migrations
        run: rm -rf SuperPrecios.Infrastructure/Migrations/*

      - name: Add new migration with timestamp
        run: |
          timestamp=$(date +'%Y%m%d%H%M%S')
          dotnet ef migrations add AutoMigration_$timestamp --project SuperPrecios.Infrastructure --startup-project SuperPrecios.Web

      - name: Update database
        run: dotnet ef database update --project SuperPrecios.Infrastructure --startup-project SuperPrecios.Web

      - name: Build with dotnet
        run: dotnet build SuperPrecios.Web/SuperPrecios.Web.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish SuperPrecios.Web/SuperPrecios.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_024F0D65D3154002BB0891039514E05B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_423B4E0F4A22407DBCC128ADDD13F8FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A9AFC8691DDB43818B376A706E5B7AD2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'superprecios'
          slot-name: 'Production'
          package: .
