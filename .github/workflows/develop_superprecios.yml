name: Build and deploy ASP.Net Core app to Azure Web App - SuperPrecios

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SuperPrecios.Web/SuperPrecios.Web.csproj

      - name: Build
        run: dotnet build SuperPrecios.Web/SuperPrecios.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SuperPrecios.Web/SuperPrecios.Web.csproj --configuration Release --output ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: superprecios-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: superprecios-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_024F0D65D3154002BB0891039514E05B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_423B4E0F4A22407DBCC128ADDD13F8FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A9AFC8691DDB43818B376A706E5B7AD2 }}

      - name: Setup .NET for EF Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF Tools
        run: dotnet tool install --global dotnet-ef

      - name: Apply EF Core migrations
        env:
          ConnectionStrings__ConexionBD: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet ef database update \
            --project SuperPrecios.Infrastructure/SuperPrecios.Infrastructure.csproj \
            --startup-project SuperPrecios.Web/SuperPrecios.Web.csproj \
            --context SuperPreciosDbContext

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'superprecios'
          slot-name: 'Production'
          package: .
